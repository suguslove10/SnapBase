name: SnapBase DB Branching & Sync CI/CD

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  db-branching:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Provision Ephemeral DB Branch on PR Open
        if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event_name == 'workflow_dispatch'
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUM" ]; then PR_NUM="manual-run"; fi
          API_URL="${{ secrets.SNAPBASE_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://api.getsnapbase.com"; fi
          CONN_ID="${{ secrets.SNAPBASE_SOURCE_CONN_ID }}"
          if [ -z "$CONN_ID" ]; then CONN_ID="1"; fi
          echo "Triggering SnapBase DB Branching for branch pr-${PR_NUM} at ${API_URL}..."
          curl -X POST "${API_URL}/api/branching/create" \
            -H "Authorization: Bearer ${{ secrets.SNAPBASE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"connection_id\": ${CONN_ID},
              \"branch_name\": \"pr-${PR_NUM}\"
            }"

      - name: Teardown DB Branch on PR Close
        if: github.event.action == 'closed'
        run: |
          echo "Tearing down SnapBase DB Branch for PR #${{ github.event.pull_request.number }}..."
          curl -X DELETE "${{ secrets.SNAPBASE_API_URL }}/api/branching/pr-${{ github.event.pull_request.number }}" \
            -H "Authorization: Bearer ${{ secrets.SNAPBASE_API_TOKEN }}"

